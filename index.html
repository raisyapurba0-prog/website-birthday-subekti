
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Untuk Subekti ♡</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="password-page">

        <div class="particles"></div>

        <div class="password-content">

            <h1>UNTUK ORANG YANG SPESIAL, YAITU SUBEKTI ♡</h1>

            <label for="password">
                MASUKKAN SANDI UNTUK MELANJUTKAN
            </label>

            <input
                type="password"
                id="password"
                placeholder="Masukkan sandi"
                autocomplete="off"
            >

            <button id="enterButton">MASUK</button>

            <p id="errorMessage"></p>

        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
