
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Music Time ♡</title>

    <link rel="stylesheet" href="musik.css">
</head>

<body>

    <main class="music-page">

        <div class="music-glow"></div>

        <header class="music-header">
            <p class="music-label">A LITTLE MUSIC FOR YOUR SPECIAL DAY</p>

            <h1>
                WAKTUNYA<br>
                GOYAAANGGG!
            </h1>

            <p class="music-subtitle">
                Siap-siap ikut bergoyang! ♡
            </p>

            <div class="gold-divider">✦</div>
        </header>

        <section class="music-player" id="musicPlayer">

            <!-- PIRINGAN HITAM -->
            <div class="music-disc" id="musicDisc">
                <div class="disc-center">
                    <span>♡</span>
                </div>
            </div>

            <!-- INFORMASI LAGU -->
            <div class="song-info">
                <p class="song-title">TATITUT</p>
                <p class="song-artist">Ayu Ting Ting</p>
            </div>

            <!-- KARAKTER MENARI -->
            <div class="dance-area">
                <div class="dancer" id="dancer">
                    <div class="dancer-head">♫</div>
                    <div class="dancer-body"></div>
                    <div class="dancer-arm left-arm"></div>
                    <div class="dancer-arm right-arm"></div>
                    <div class="dancer-leg left-leg"></div>
                    <div class="dancer-leg right-leg"></div>
                </div>
            </div>

            <!-- VISUALIZER -->
            <div class="music-visualizer" id="visualizer">
                <span></span><span></span><span></span>
                <span></span><span></span><span></span>
                <span></span><span></span><span></span>
                <span></span><span></span><span></span>
                <span></span>
            </div>

            <!-- LIRIK -->
            <div class="lyrics-box">
                <p class="lyrics-label">
                    SING ALONG WITH THE MUSIC ♡
                </p>

                <div class="lyrics-display">
                    <p class="lyric-line active" id="currentLyric">
                        Nikmati musiknya! ♡
                    </p>
                </div>

                <p class="lyrics-page" id="lyricsPage">
                    01 / 08
                </p>
            </div>

            <!-- AUDIO -->
            <audio id="birthdayMusic" src="assets/musik/tatitut.mp3" preload="metadata"></audio>

            <!-- KONTROL MUSIK -->
            <div class="music-controls">

                <button id="playButton">
                    ▶ PUTAR MUSIK
                </button>

                <button id="pauseButton">
                    Ⅱ JEDA
                </button>

                <button id="replayButton">
                    ↻ PUTAR ULANG
                </button>

            </div>

            <p class="music-note">
                Jangan lupa atur volumenya, ya! ♡
            </p>

            <!-- LANJUT KE HALAMAN KUE -->
            <a
                href="./kue.html"
                class="continue-button"
                id="continueButton"
                hidden
            >
                LANJUTKAN →
            </a>

        </section>

        <footer class="music-footer">
            ENJOY THE MUSIC ♡
        </footer>

    </main>

    <script src="musik.js"></script>

</body>
</html>
